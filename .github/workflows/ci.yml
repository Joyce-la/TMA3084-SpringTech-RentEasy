name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Build Frontend
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Install dependencies
      - name: Install dependencies
        working-directory: src/frontend
        run: flutter pub get

      # Check Dart formatting
      - name: Check formatting
        working-directory: src/frontend
        run: dart format --output=none --set-exit-if-changed lib test

      # Analyze code
      - name: Analyze code
        working-directory: src/frontend
        run: flutter analyze

      # Run tests
      - name: Run tests
        working-directory: src/frontend
        run: flutter test

      # Build Android APK
      - name: Build Android APK
        working-directory: src/frontend
        run: flutter build apk --debug

  # Build Backend
  backend:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Set up Dart
      - uses: dart-lang/setup-dart@v1

      # Install dependencies
      - name: Install dependencies
        working-directory: src/backend
        run: dart pub get

      # Check Dart formatting
      - name: Check formatting
        working-directory: src/backend
        run: dart format --output=none --set-exit-if-changed .

      # Analyze code
      - name: Analyze code
        working-directory: src/backend
        run: dart analyze

      # Run tests
      - name: Run tests
        working-directory: src/backend
        run: dart test
