name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: src/pubspec.lock

      # Install dependencies
      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      # Check Dart formatting
      - name: Check formatting
        working-directory: src
        run: dart format --output=none --set-exit-if-changed lib test

      # Analyze code
      - name: Analyze code
        working-directory: src
        run: flutter analyze

      # Run tests
      - name: Run tests
        working-directory: src
        run: flutter test

      # Build Android APK
      - name: Build Android APK
        working-directory: src
        run: flutter build apk --debug
